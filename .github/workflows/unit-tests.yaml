name: Unit Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # The tests import `PlotKit.<module>` from the parent of the checkout, whose directory is
      # named after the repository.
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The plotting stack FLAF pins in flaf_env (mk_flaf_env.sh), so the mplhep backend is
      # tested as production runs it. No ROOT: the cmsstyle tests skip themselves.
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install numpy==2.4.4 matplotlib==3.11.0 mplhep==1.1.3 pyyaml==6.0.2 uproot==5.7.1 pytest

      - name: Run tests
        run: python -m pytest -q -rs -p no:cacheprovider tests
