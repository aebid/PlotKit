name: Unit Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # The tests import `PlotKit.<module>` from the parent of the checkout, so it is checked
      # out into a directory named PlotKit, whatever the repository (or fork) is called.
      - uses: actions/checkout@v4
        with:
          path: PlotKit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The versions flaf_env has on LCG_110a (mplhep pinned in mk_flaf_env.sh, the rest from
      # the view), so the mplhep backend is tested as production runs it. No ROOT: the
      # cmsstyle tests skip themselves here and run in the job below.
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install numpy==2.4.4 matplotlib==3.11.0 mplhep==1.1.3 pyyaml==6.0.2 uproot==5.7.1 pytest==9.0.3

      - name: Run tests
        run: python -m pytest -q -rs -p no:cacheprovider PlotKit/tests

  # The same tests with ROOT and cmsstyle, so the cmsstyle backend's renders are tested too.
  # PLOTKIT_REQUIRE_ROOT makes a missing ROOT or cmsstyle fail those tests instead of
  # skipping them.
  cmsstyle-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: PlotKit

      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: plotkit
          python-version: '3.13'

      # flaf_env's ROOT and cmsstyle (mk_flaf_env.sh), and the versions of the job above.
      - name: Install ROOT and dependencies
        run: |
          conda install -y root=6.40.04 numpy=2.4.4 matplotlib=3.11.0 pyyaml=6.0.2 uproot=5.7.1 pytest=9.0.3
          pip install mplhep==1.1.3 cmsstyle==0.5.0

      - name: Run tests with ROOT required
        env:
          PLOTKIT_REQUIRE_ROOT: "1"
        run: python -m pytest -q -rs -p no:cacheprovider PlotKit/tests
